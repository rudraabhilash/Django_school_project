<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success</title>
    <style>
       table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid rgb(239, 226, 226);
            padding: 8px;
            text-align: center;
        }
        th {
            color: white; /* Make header text white */
        }
        td {
            color: white; /* Make table data text white */
        }

        html {
            font-family: 'Roboto', sans-serif; /* Use Roboto font */
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #000000, #333333); /* Smooth gradient from black to dark gray */
            background-repeat: no-repeat;
            height: 100%; /* Ensure the HTML element covers the entire viewport height */
        }
        h1 {
            color: white;
            text-align: center; /* Center the header text */
        }
       
        
    </style>
</head>
<body>
<h1>Form submitted successfully!</h1>

<h1>Payment Details</h1>
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Student Id</th>
                    <th>Fee Paid</th>
                    <th>Date of Payment</th>
                    <th>Due</th>
                    <th>Payment Mode</th>
                </tr>
            </thead>
            <tbody>
                {% for x in paymentstatus %}
                    <tr>
                        <td>{{ x.id }}</td>
                        <td>{{ x.student_id }}</td>
                        <td>{{ x.fee_paid }}</td>
                        <td>{{ x.date_of_payment }}</td>
                        <td>{{ x.due }}</td>
                        <td>{{ x.payment_mode }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
{% comment %} <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "rzp_test_SV6BrBUH8Wpagy", // Enter the Key ID generated from the Dashboard
    "amount": "50000", // Amount is in currency subunits. 
    "currency": "INR",
    "name": "Nikhil Kumar",
    "description": "Test Transaction",
    "image": "https://example.com/your_logo",
    "order_id": "order_IluGWxBm9U8zJ8", //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
    "handler": function (response){
        alert(response.razorpay_payment_id);
        alert(response.razorpay_order_id);
        alert(response.razorpay_signature)
    },
    "theme": {
        "color": "#3399cc"
    }
};
var rzp1 = new Razorpay(options);
rzp1.on('payment.failed', function (response){
        alert(response.error.code);
        alert(response.error.description);
        alert(response.error.source);
        alert(response.error.step);
        alert(response.error.reason);
        alert(response.error.metadata.order_id);
        alert(response.error.metadata.payment_id);
});
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script> {% endcomment %}
</body>
</html>
