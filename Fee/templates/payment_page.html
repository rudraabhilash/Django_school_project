
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #fff;
      width: 320px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    .logo {
      width: 70px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .amount {
      font-size: 28px;
      color: #2ecc71;
      margin: 15px 0;
      font-weight: bold;
    }

    .desc {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .pay-btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: #3399cc;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .pay-btn:hover {
      background: #287aa9;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="card">
    <!-- You can replace this logo -->
    <img src="https://via.placeholder.com/70" class="logo" alt="Logo">

    <h2>Payment Gateway</h2>

    <div class="amount">₹500</div>

    <p class="desc">Complete your secure payment using Razorpay</p>

    <!-- 🔽 Attach your Razorpay script or onclick here -->

    <button class="rzp-button1" id="rzp-button1">
      Pay Now
    </button>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  
var options = {
    "key": "rzp_test_SV6BrBUH8Wpagy", // Enter the Key ID generated from the Dashboard
    "amount": "{{payment.amount}}", // Amount is in currency subunits. 
    "currency": "INR",
    "name": "Nikhil Kumar",
    "description": "Test Transaction",
    "image": "https://example.com/your_logo",
    "order_id": "{{payment.id}}", //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
    "handler": function (response){
        alert(response.razorpay_payment_id);
        alert(response.razorpay_order_id);
        alert(response.razorpay_signature);
        window.location.href = "/feesuccess";
    },
    "theme": {
        "color": "#3399cc"
    }
};
var rzp1 = new Razorpay(options);
rzp1.on('payment.failed', function (response){
        alert(response.error.code);
        alert(response.error.description);
        alert(response.error.source);
        alert(response.error.step);
        alert(response.error.reason);
        alert(response.error.metadata.order_id);
        alert(response.error.metadata.payment_id);
});
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
    <div class="footer">
      Secure Payment • Razorpay
    </div>
  </div>

</body>
</html>
